<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ação Social - Paróquia São Pedro e São Paulo</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Navegação -->
    <nav class="bg-blue-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">Ação Social - São Pedro e São Paulo</h1>
            <div class="space-x-4">
                <a href="/" class="hover:underline font-medium">Dashboard</a>
                <a href="/estoque" class="hover:underline font-medium">Estoque de Alimentos</a>
                <a href="/beneficiarios" class="hover:underline font-medium">Beneficiários</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-gray-800 text-white text-center py-3 text-sm">
        <p>Sistema de Gestão Extensionista - UFBRA | Vila São Pedro, São Bernardo do Campo</p>
    </footer>

</body>
</html>
